<title>Kanat</title>
<style>
/* Tam ekran tuval; arayüz üstte durur, ekranın her yerine dokunmak zıplatır. Alacakaranlık gökyüzü, koyu zemin, tek sıcak vurgu: kuş. */
:root {
  --sky-top: #2b3a67;
  --sky-bot: #f2a07b;
  --hills: #3b3361;
  --pipe: #1d5c63;
  --pipe-hi: #2f8a8c;
  --ground: #2a2340;
  --ground-hi: #4a3f6b;
  --ink: #fff7ee;
  --accent: #ffd166;
  --beak: #ef6f3c;
  --wing: #f4a261;
  --card: rgba(26, 20, 48, 0.74);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
body {
  margin: 0;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#c { display: block; width: 100%; height: 100%; }
#ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 11%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.panel { text-align: center; max-width: 320px; width: 100%; }
h1 {
  margin: 0;
  font-size: 60px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--accent);
  text-shadow: 0 3px 0 rgba(20, 14, 40, 0.45);
}
h2 { margin: 0 0 14px; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
p { margin: 12px 0 0; font-size: 17px; line-height: 1.4; text-shadow: 0 1px 0 rgba(20, 14, 40, 0.5); text-wrap: balance; }
.hint {
  display: inline-block;
  margin-top: 18px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  animation: pulse 1.4s ease-in-out infinite;
}
.card { background: var(--card); border-radius: 18px; padding: 22px 20px 20px; }
dl { display: flex; margin: 0; gap: 12px; }
dl div { flex: 1; min-width: 0; }
dt { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
dd { margin: 4px 0 0; font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>

<canvas id="c"></canvas>
<div id="ui">
  <div id="ready" class="panel" role="status">
    <h1>Kanat</h1>
    <p>Dokun, zıpla, boruların arasından geç.</p>
    <p id="bestReady" hidden></p>
    <span class="hint">Başlamak için dokun</span>
  </div>
  <div id="over" class="panel card" role="status" hidden>
    <h2>Bitti</h2>
    <dl>
      <div><dt>Skor</dt><dd id="sNow">0</dd></div>
      <div><dt>En iyi</dt><dd id="sBest">0</dd></div>
    </dl>
    <span class="hint">Tekrar için dokun</span>
  </div>
  <div id="paused" class="panel card" role="status" hidden>
    <h2>Durdu</h2>
    <span class="hint">Devam için dokun</span>
  </div>
</div>

        if (!p.passed && p.x + PW < birdX - 12) { p.passed = true; score++; }
      }
      if (state === 'play' && bird.y + R >= floor) { bird.y = floor - R; die(); }
    } else {
      bird.rot = Math.min(1.5, bird.rot + 0.05);
      if (bird.y + R >= floor) { bird.y = floor - R; bird.vy = 0; }
    }
    if (flash > 0) flash = Math.max(0, flash - 0.06);
  }

  function drawBird() {
    var open = state !== 'dead' && Math.floor(flapT / (state === 'ready' ? 9 : 6)) % 2 === 0;
    var img = open ? imgs.open : imgs.closed;
    if (!img.complete || !img.naturalWidth) return;
    ctx.save();
    ctx.translate(birdX, bird.y);
    ctx.rotate(bird.rot);
    ctx.drawImage(img, -SPR.ax * SPR.dw, -SPR.ay * SPR.dh, SPR.dw, SPR.dh);
    ctx.restore();
  }

  function drawPipe(p) {
    var floor = H - GROUND, bottomY = p.top + p.gap;
    ctx.fillStyle = C.pipe;
    ctx.fillRect(p.x, 0, PW, p.top);
    ctx.fillRect(p.x, bottomY, PW, floor - bottomY);
    ctx.fillStyle = C.pipeHi;
    ctx.fillRect(p.x + 6, 0, 8, p.top);
    ctx.fillRect(p.x + 6, bottomY, 8, floor - bottomY);
    ctx.fillStyle = C.pipe;
    ctx.fillRect(p.x - 3, p.top - 22, PW + 6, 22);
    ctx.fillRect(p.x - 3, bottomY, PW + 6, 22);
    ctx.fillStyle = C.pipeHi;
    ctx.fillRect(p.x + 3, p.top - 22, 8, 22);
    ctx.fillRect(p.x + 3, bottomY, 8, 22);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H - GROUND);

    // alçak güneş
    ctx.fillStyle = 'rgba(255, 226, 170, 0.35)';
    ctx.beginPath(); ctx.arc(W * 0.72, H * 0.5, 54, 0, 6.2832); ctx.fill();

    // uzak tepeler
    ctx.fillStyle = C.hills;
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND);
    for (var x = 0; x <= W + 8; x += 8) {
      var y = H - GROUND - 64 + Math.sin((x + bgX) * 0.012) * 18 + Math.sin((x + bgX) * 0.031) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 8, H - GROUND);
    ctx.closePath();
    ctx.fill();

    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);

    // zemin
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, H - GROUND, W, GROUND + 4);
    ctx.fillStyle = C.groundHi;
    ctx.fillRect(0, H - GROUND, W, 6);
    for (var gx = -groundX; gx < W; gx += 24) ctx.fillRect(gx, H - GROUND + 20, 12, 4);

    drawBird();

    if (state === 'play' || state === 'dead') {
      ctx.font = '800 56px ' + C.font;
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(20, 14, 40, 0.55)';
      ctx.strokeText(String(score), W / 2, 100);
      ctx.fillStyle = C.ink;
      ctx.fillText(String(score), W / 2, 100);
    }

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (flash * 0.6) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  var last = 0, acc = 0, STEP = 1000 / 60;
  function frame(ts) {
    if (!last) last = ts;
    if (!paused) {
      acc += Math.min(ts - last, 100);
      while (acc >= STEP) { step(); acc -= STEP; }
    }
    last = ts;
    draw();
    requestAnimationFrame(frame);
  }

  document.addEventListener('pointerdown', function (e) { e.preventDefault(); input(); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) input(); }
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'play') { paused = true; showPanels(); }
    last = 0;
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
